name: Hourly flight board refresh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flight-board-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the board
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh from approved normalized feed when configured
        run: node scripts/refresh.mjs
        env:
          FLIGHT_BOARD_FEED_URL: ${{ secrets.FLIGHT_BOARD_FEED_URL }}
          FLIGHT_BOARD_FEED_TOKEN: ${{ secrets.FLIGHT_BOARD_FEED_TOKEN }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
